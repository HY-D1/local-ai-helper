memory:
  embedding_model: "all-MiniLM-L6-v2"
  max_context_messages: 10
  similarity_threshold: 0.7
  max_retrieved_chunks: 5
  chunk_size: 512
  chunk_overlap: 50

system:
  log_level: "INFO"
  enable_streaming: true
  max_concurrent_requests: 5
  request_timeout_seconds: 300
